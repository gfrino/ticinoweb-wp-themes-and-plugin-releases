# Crea la release di un tema o plugin quando viene pushato un tag
# `<slug>-v<versione>` che punta a un commit contenente
# `incoming/<slug>-<versione>.zip` (e, opzionale, `incoming/<slug>-<versione>.md`
# con il changelog). Usa il token interno di GitHub Actions: chi pubblica
# ha bisogno solo dell'accesso git (SSH) al repo, non di un token personale.
#
# Se la release esiste gia' (creata a mano o via API, che crea anche il tag)
# il workflow non fa nulla.
name: Release da tag

on:
  push:
    tags:
      - '*-v*'

permissions:
  contents: write

# Un solo run alla volta per tag: se lo stesso tag arriva due volte quasi
# insieme, il secondo run aspetta il primo e trova la release gia' creata.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Crea la release con lo zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SLUG="${TAG%-v*}"
          VER="${TAG##*-v}"
          ZIP="incoming/${SLUG}-${VER}.zip"
          NOTES="incoming/${SLUG}-${VER}.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG esiste gia': niente da fare."
            exit 0
          fi
          if [ ! -f "$ZIP" ]; then
            echo "Nessun $ZIP nel commit del tag: niente da fare."
            exit 0
          fi
          if ! echo "$VER" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "::error::Versione non valida nel tag: $VER"
            exit 1
          fi
          # L'updater richiede la cartella <slug>/ alla radice dello zip.
          if unzip -Z1 "$ZIP" | grep -qv "^${SLUG}/"; then
            echo "::error::$ZIP contiene file fuori dalla cartella ${SLUG}/"
            exit 1
          fi
          [ -f "$NOTES" ] || echo "- Release ${VER}" > "$NOTES"

          if ! gh release create "$TAG" "$ZIP" \
            --title "$TAG" \
            --notes-file "$NOTES" \
            --verify-tag 2>err.log; then
            cat err.log
            # Creata nel frattempo da un altro run: non e' un errore.
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "La release $TAG e' stata creata da un altro run: niente da fare."
              exit 0
            fi
            exit 1
          fi
